#import './user.graphql'
#import './category.graphql'
#import './page.graphql'

fragment Design on Design {
    id           
    polotnoId    
    name         
    preview      
    pages {
        ...Page
    }        
    width        
    height       
    fonts        
    unit         
    dpi          
    public
    publishedDate
    editedDate   
    categories {
        ...Category
    }       
    creator {
        ...User
    }  
    tags             
}
