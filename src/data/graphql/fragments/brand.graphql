#import './compactCategory.graphql'

fragment Brand on Brand {
    id
    prettySmartId
    email
    colors {
      id
      primary
      rank
      value
    }
    fonts {
      bold
      italic
      google
      id
      name
      url
      value
    }
    icon
    industry
    logo
    name
    phone
    tagline
    specialCategories {
      ...CompactCategory
    }
    wordmark
  }