server {
  listen 80;
  server_name _;

  # Root directory of built React app
  root /usr/share/nginx/html;
  index index.html;

  # Serve asset files with aggressive caching
  location ~* \.(?:js|css|woff2?|ttf|svg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(?:png|jpg|jpeg|gif|ico|webp)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Pass all application routes (including /branded-design/* and /design/*) to the SPA entry point
  location / {
    # If the requested file or directory exists, serve it directly, otherwise fallback to index.html
    try_files $uri $uri/ /index.html;
  }

  # Optional explicit branded-design path handler (redundant due to root block but kept for clarity)
  location ~ ^/(branded-design|design)/ {
    try_files $uri /index.html;
  }

  # Basic security headers (can be extended)
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";

  # Log format tweaks (optional)
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
}
